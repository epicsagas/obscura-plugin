[package]
name = "obscura-plugin"
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/epicsagas/obscura-plugin"
homepage = "https://github.com/epicsagas/obscura-plugin"
description = "Installer for Obscura headless browser skills"
keywords = ["web-scraping", "headless-browser", "ai-agent"]
categories = ["command-line-utilities", "development-tools"]
authors = ["epicsagas"]
readme = "README.md"
exclude = [
    ".github/",
    ".claude-plugin/",
    ".codex-plugin/",
    ".agents/",
    "hooks/",
    "registry/",
    "scripts/",
    "tests/",
    "stitch-screens/",
]

[[bin]]
name = "obscura-plugin"
path = "src/main.rs"

[lib]
name = "obscura_plugin"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.xz"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }.exe"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[profile.dist]
inherits = "release"
lto = "thin"
